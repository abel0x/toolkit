<!DOCTYPE html>
<!--
  Source of the social preview images (assets/images/og-en.png, og-tr.png).
  Not published. Render at 1200×630, for example:
    chromium --headless --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot=assets/images/og-en.png \
      "file://$PWD/_includes/og-card.html#en"
  and again with #tr and og-tr.png. Then run python3 build.py --all.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Toolkit social card</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('../assets/fonts/JetBrainsMono.woff2') format('woff2'); font-weight: 100 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0a0a0a;
    color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  }
  .card { position: absolute; inset: 0; padding: 64px 88px 56px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 36px; font-weight: 650; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; border: 1px solid #262626; }
  h1 {
    margin-top: 48px; max-width: 980px;
    font-size: 72px; font-weight: 650; line-height: 1.06; letter-spacing: -0.035em;
  }
  .tagline { margin-top: 22px; max-width: 900px; font-size: 30px; line-height: 1.35; color: #a1a1a1; }
  .footer {
    margin-top: auto; padding-top: 26px; border-top: 1px solid #262626;
    display: flex; justify-content: space-between; align-items: center;
    font: 500 22px 'JetBrains Mono', monospace; color: #8f8f8f;
  }
  .facts { display: flex; gap: 28px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../assets/images/favicon-512.png" alt="" />Toolkit</div>
    <h1 data-copy="headline">Everyday developer utilities, without the backend.</h1>
    <p class="tagline" data-copy="tagline">Encoding, security, JSON, text and web tools that run entirely in your browser.</p>
    <div class="footer">
      <div class="facts">
        <span data-copy="fact1">No tracking</span>
        <span data-copy="fact2">Works offline</span>
        <span data-copy="fact3">Open source</span>
      </div>
      <span>abel0x.github.io/toolkit</span>
    </div>
  </div>
  <script>
    const copy = {
      tr: {
        headline: 'Günlük geliştirici araçları, sunucu olmadan.',
        tagline: 'Tamamen tarayıcınızda çalışan kodlama, güvenlik, JSON, metin ve web araçları.',
        fact1: 'İzleme yok',
        fact2: 'Çevrimdışı çalışır',
        fact3: 'Açık kaynak'
      }
    };
    const language = location.hash.slice(1);
    if (copy[language]) {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-copy]').forEach((node) => { node.textContent = copy[language][node.dataset.copy]; });
    }
  </script>
</body>
</html>
