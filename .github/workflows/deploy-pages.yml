name: Deploy Toolkit to GitHub Pages

# Pull requests run the full build and test pipeline; only main deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      # Generated files (nav, counts, precache lists, cache version) must be
      # committed; run `python3 build.py --all` locally when this fails.
      - name: Check generated files are up to date
        run: python3 build.py --check

      - name: Audit published site
        run: node tests/site-audit.mjs

      - name: Audit tool DOM contracts
        run: node tests/tool-dom-audit.mjs

      - name: Audit word lists
        run: node tests/words-audit.mjs

      - name: Audit localisation
        run: node tests/i18n-audit.mjs

      - name: Test conversion edge cases
        run: node tests/conversion-regressions.mjs

      - name: Audit accessibility contracts
        run: node tests/accessibility-audit.mjs

      - name: Smoke-test every tool page in Firefox
        run: node tests/tool-pages-e2e.mjs

      - name: Exercise browser tool flows in Firefox
        run: node tests/expansion-e2e.mjs

      - name: Exercise typing and localisation regressions
        run: node tests/typing-regressions.mjs

      - name: Exercise audit regressions in Firefox
        run: node tests/audit-regressions.mjs

      - name: Check tool outputs against known answers in Firefox
        run: node tests/tool-vectors.mjs

      - name: Assemble the published site
        run: python3 build.py --site

      - name: Exercise the installed offline site in Firefox
        run: node tests/offline-e2e.mjs
        env:
          TOOLKIT_SITE_ROOT: ${{ github.workspace }}/_site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
